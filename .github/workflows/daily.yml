
name: daily-options
 
on:
  schedule:
    - cron: "30 21 * * 1-5"
  workflow_dispatch:
 
permissions:
  contents: write
 
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - run: python leveraged_options.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data
          git commit -m "options $(date +%F)" || exit 0
          git push
